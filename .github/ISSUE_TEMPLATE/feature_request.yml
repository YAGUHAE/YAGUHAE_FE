name: "✨ 기능 제안"
description: 새로운 기능이나 개선 아이디어를 제안합니다
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제
      description: 어떤 불편함이나 문제 상황 때문에 이 제안을 하게 되었나요?
      placeholder: 예) ~할 때 ~한 부분이 불편해요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 기능
      description: 어떤 기능/해결 방법을 제안하시나요?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 방법도 고려해보셨다면 작성해주세요.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 참고 자료, 스크린샷, 관련 링크 등을 첨부해주세요.
    validations:
      required: false
