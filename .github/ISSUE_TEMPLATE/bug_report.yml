name: "🐛 버그 리포트"
description: 버그를 발견했을 때 리포트합니다
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 버그가 발생했는지 설명해주세요.
      placeholder: 무엇이 잘못되었나요?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 버그를 재현할 수 있는 순서를 작성해주세요.
      placeholder: |
        1. '...'로 이동
        2. '...'을 클릭
        3. 에러 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      description: 원래 어떻게 동작해야 하나요?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작 / 스크린샷
      description: 실제로 어떤 일이 발생했는지, 있다면 스크린샷이나 영상을 첨부해주세요.
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: 브라우저
      placeholder: 예) Chrome 120, Safari 17
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: 예) macOS 15, Windows 11
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 그 외 참고할만한 내용이 있다면 작성해주세요.
    validations:
      required: false
